name: Boutique360
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  bundleIdPrefix: com.boutique360.designer
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    GENERATE_INFOPLIST_FILE: "NO"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SDKROOT: iphoneos
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
configFiles:
  Debug: Boutique360/Configuration/Env.xcconfig
  Release: Boutique360/Configuration/Env.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.20.0"
targets:
  Boutique360:
    type: application
    platform: iOS
    sources:
      - path: Boutique360
        excludes:
          - Configuration/Env.xcconfig
    resources:
      - Boutique360/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: Boutique360/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.boutique360.designer.ipad
        CODE_SIGN_ENTITLEMENTS: Boutique360/Boutique360.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: Supabase
        product: Supabase
    scheme:
      testTargets:
        - Boutique360Tests
      gatherCoverageData: true
  Boutique360Tests:
    type: bundle.unit-test
    platform: iOS
    sources: [Boutique360Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: Boutique360
